version: '3.8'

# MaxKB 中间件服务配置
# 包含 PostgreSQL (with pgvector) 和 Redis
# 
# 使用方法:
#   启动: docker-compose -f docker-compose-middleware.yml up -d
#   查看: docker-compose -f docker-compose-middleware.yml ps
#   停止: docker-compose -f docker-compose-middleware.yml down
#
# 注意: 首次启动需要 30-60 秒初始化，等待健康检查显示 healthy

services:
  # PostgreSQL 17 with pgvector 扩展
  # 用于存储 MaxKB 的主要数据和向量数据
  postgres:
    image: pgvector/pgvector:pg17
    container_name: maxkb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Password123@postgres
      POSTGRES_MAX_CONNECTIONS: 1000
    ports:
      - "35432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
      - ./installer/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=2621kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d maxkb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - maxkb-network

  # Redis 7 
  # 用于 MaxKB 的缓存和会话存储
  redis:
    image: redis:7-alpine
    container_name: maxkb-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass Password123@redis
      --appendonly yes
      --appendfilename "appendonly.aof"
      --appendfsync everysec
      --save 30 1
      --save 10 10
      --save 5 20
      --dbfilename dump.rdb
      --rdbcompression yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --aof-use-rdb-preamble yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --databases 16
      --loglevel warning
    ports:
      - "36379:6379"
    volumes:
      - ./data/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Password123@redis", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - maxkb-network

networks:
  maxkb-network:
    driver: bridge
    name: maxkb-network

volumes:
  postgres_data:
  redis_data:

