name: 🐛 Bug Report
description: 创建一个关于 Bug 的详细报告，帮助我们改进
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 Bug！请填写以下信息帮助我们快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述发生了什么问题。
      placeholder: 比如：点击“开始分析”按钮后，页面卡死...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何重现这个 Bug？
      placeholder: |
        1. 运行 'python main.py'
        2. 输入参数 '...'
        3. 看到报错信息...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: OS, Python 版本, 依赖库版本等
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.10
        - Browser: Chrome 110
  - type: textarea
    id: logs
    attributes:
      label: 报错日志
      description: 请粘贴相关的日志输出或截图。
      render: shell